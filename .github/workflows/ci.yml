name: ci

on:
  push:
    branches: [dev_rework, dev, main]
  pull_request:
    branches: [dev_rework, dev, main]

env:
  UV_FROZEN: "1"

jobs:
  fast:
    name: fast tests (no model download)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (builds the okf-embed path dependency)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/okf-embed

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync (frozen lockfile, dev extra)
        run: uv sync --frozen --extra dev

      - name: Pure + harness tests (no ONNX load, no downloads)
        run: >
          uv run --frozen pytest
          tests/test_ranking.py
          tests/test_mcp_server.py
          tests/test_packaging.py
          tests/test_diff.py::TestDiffPure
          tests/test_doctor.py::TestDoctorPure
          tests/test_obsidian.py::TestWikiLinksPure
          tests/test_roundup_cli.py::TestRoundupHelp
          -q

  rust:
    name: cargo test (okf-embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/okf-embed

      # pyo3 links libpython into the test binary (extension-module is only
      # enabled for wheel builds via maturin).
      - name: libpython
        run: sudo apt-get update && sudo apt-get install -y libpython3-dev

      - name: Rust unit tests (no network, no ORT dylib)
        working-directory: rust/okf-embed
        run: cargo test --locked

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Requires-Dist sanity (okf-embed must be a plain PyPI pin)
        run: |
          uv run --frozen --no-sync python -c "
          import zipfile, glob
          whl = sorted(glob.glob('dist/*.whl'))[-1]
          zf = zipfile.ZipFile(whl)
          meta = zf.read(next(n for n in zf.namelist() if n.endswith('METADATA'))).decode()
          requires = [line.split('Requires-Dist:', 1)[1].strip() for line in meta.splitlines() if line.startswith('Requires-Dist:')]
          assert any(r.startswith('okf-embed>=') for r in requires), requires
          assert all('path' not in r and 'file:' not in r for r in requires), requires
          assert 'Description-Content-Type: text/markdown' in meta, meta
          lines = meta.splitlines()
          body = '\n'.join(lines[lines.index('') + 1:])
          assert len(body.strip()) > 100, len(body)
          print('wheel metadata PyPI-clean')
          "
