name: release

# Publish okfgraph to PyPI.
#
# Flow: push a tag named `v<pyproject version>` (e.g. v0.2.12). This workflow
# then builds the okfgraph sdist+wheel and publishes it (OIDC trusted
# publishing, no tokens).
#
# The embedding engine is NOT built here: since 0.2.12 it is the external
# `embroider` crate (github.com/opticsWolf/embroider), whose own release
# workflow publishes crates.io + PyPI wheels. This workflow only pins the
# floor (`embroider>=0.1,<0.2`) — those wheels are already live when a
# tag lands.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare release tag with okfgraph version
        run: |
          python -c "
          import os, tomllib
          tag = os.environ['TAG']
          want = 'v' + tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert tag == want, f'release tag {tag} != pyproject {want}'
          print('version ok:', tag)
          "
        env:
          TAG: ${{ github.ref_name }}

  publish-okfgraph:
    name: publish okfgraph to PyPI
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
