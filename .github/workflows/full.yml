# Full suite with warmed model cache — weekly drift insurance + pre-release proof.
#
# - schedule (Sundays 02:00 UTC): runs on the DEFAULT branch (main) — health
#   of the shipped stack (model weights, runner images, test rot).
# - workflow_dispatch: pick any branch (e.g. dev) before cutting a release.
#
# The per-push `ci` workflow deliberately stays model-free; this is the only
# job that downloads models. The HF hub dir is cached by model id — bump the
# `v1` suffix if the pinned models change. Deliberately infrequent (weekly,
# not nightly): the lockfile is frozen, so daily re-runs would re-prove an
# unchanged stack.

name: full-suite

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: full suite (model-cached)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Sync (frozen lockfile, all extras)
        run: uv sync --frozen --extra dev --extra pdf --extra omni

      - name: Full non-slow suite
        run: uv run --frozen pytest -m "not slow" -q -p no:cacheprovider
