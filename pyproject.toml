[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "okfgraph"
version = "0.10.0"
description = "Ladybug-backed OKF knowledge graph with ONNX + Jina v5 embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
dependencies = [
    # Pinned: ladybug 0.20.x segfaults building a second in-process vector
    # index (~25% under pytest, Step 6 triage); 0.21.2 runs the same loop
    # 0/12 with the full suite green.
    "ladybug==0.21.2",
    # Embedding engine — external crate (github.com/opticsWolf/embroider).
    # Floor-pinned <0.4: 0.8.x needs embroider 0.3.x (JinaV5Vision) so the
    # model registry and wheel matrix move together with releases.
    "embroider>=0.3.0,<0.4",
    "pydantic>=2.0",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "mordant>=0.9",
    "mcp>=2.0",
    "fasteners>=0.19",
    # Image decode + bicubic resize for the vision route (0.8.0): core,
    # not an extra — images are core ingestion content. Imported lazily
    # (only when image bytes are actually prepared).
    "Pillow>=11",
]

[project.urls]
Homepage = "https://opticswolf.github.io/OKFgraph/"
Documentation = "https://github.com/opticsWolf/OKFgraph/blob/main/docs/architecture.md"
Repository = "https://github.com/opticsWolf/OKFgraph"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# ONNX Runtime provider (exactly one): both distributions install the same
# `onnxruntime` module; the Rust sessions load it via ORT_DYLIB_PATH.
# cpu XOR gpu — never install both. Without either, the first encode fails
# fast with "install okfgraph[cpu] or okfgraph[gpu]".
cpu = [
    "onnxruntime==1.29.0",
]
gpu = [
    "onnxruntime-gpu[cuda,cudnn]==1.29.0",
]
# PDF conversion (default BobineConverter; custom converters need none of this)
pdf = [
    "bobine>=0.5",
]

[tool.uv]
# cpu XOR gpu enforced at resolve time (plan-onnx-only Step 2): both
# distributions install the same `onnxruntime` module, so installing both
# silently picks one. pip can't express this — `okf doctor` warns there.
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[project.scripts]
okf = "okfgraph.cli:main"
okf-mcp = "okfgraph.mcp_server:main"

[tool.setuptools.packages.find]
include = ["okfgraph*"]

[tool.pytest]
markers = [
    "slow: GPU-heavy or large-batch tests",
    "integration: Tests with real model loading",
]
addopts = ["-v", "--tb=short"]
