# cargo-deny policy for the Rust core (M6 dependency audit).
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "(Apache-2.0 OR MIT) AND BSD-3-Clause",
  "(MIT OR Apache-2.0) AND NCSA",
  "(MIT OR Apache-2.0) AND Unicode-3.0",
  "0BSD OR MIT OR Apache-2.0",
  "Apache-2.0",
  "Apache-2.0 AND ISC",
  "Apache-2.0 OR BSL-1.0",
  "Apache-2.0 OR BSL-1.0 OR MIT",
  "Apache-2.0 OR GPL-2.0-only",
  "Apache-2.0 OR ISC OR MIT",
  "Apache-2.0 OR MIT",
  "Apache-2.0 OR MIT OR Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT",
  "BSD-2-Clause",
  "BSD-2-Clause OR Apache-2.0 OR MIT",
  "BSD-3-Clause",
  "BSD-3-Clause AND MIT",
  "BSD-3-Clause OR Apache-2.0",
  "CC0-1.0 OR Apache-2.0",
  "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception",
  "CC0-1.0 OR MIT-0 OR Apache-2.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "ISC AND (Apache-2.0 OR ISC)",
  "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)",
  "MIT",
  "MIT AND BSD-3-Clause",
  "MIT OR Apache-2.0",
  "MIT OR Apache-2.0 OR LGPL-2.1-or-later",
  "MIT OR Apache-2.0 OR Zlib",
  "MIT OR Zlib OR Apache-2.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense OR MIT",
  "Unlicense OR MIT OR Apache-2.0 OR CC0-1.0",
  "Zlib",
  "Zlib OR Apache-2.0 OR MIT",
]

[[licenses.exceptions]]
# Vendored build-script patch only; workspace crates use Apache-2.0 OR MIT.
allow = ["Apache-2.0", "MIT"]
name = "esaxx-rs"

