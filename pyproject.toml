[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "okfgraph"
version = "0.5.1"
description = "Ladybug-backed OKF knowledge graph with ONNX + Jina v5 embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
dependencies = [
    # Pinned: ladybug index builds segfault on newer 0.20.x (verified 0.20.3).
    "ladybug==0.20.3",
    # Embedding engine — external crate (github.com/opticsWolf/embroider).
    # Floor-pinned <0.2: 0.2.x of okfgraph stays on embroider 0.1.x so the
    # Jina contract and wheel matrix move together with releases.
    "embroider>=0.1.5,<0.2",
    "pydantic>=2.0",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Single pinned ORT binary shared by bobine + embroider (both load
    # dynamically; resolve_ort_dylib() points ORT_DYLIB_PATH here).
    # Verified against ort 2.0.0-rc.13 + bobine 0.5.10 — do not float.
    "onnxruntime==1.29.0",
    "mordant>=0.9",
    "mcp>=2.0",
    "fasteners>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# PDF conversion (default BobineConverter; custom converters need none of this)
pdf = [
    "bobine>=0.5",
]
# Multimodal image path (omni embeddings; text-only installs skip this)
omni = [
    "sentence-transformers>=3.0",
    "Pillow>=10.0",
]

[project.scripts]
okf = "okfgraph.cli:main"
okf-mcp = "okfgraph.mcp_server:main"

[tool.setuptools.packages.find]
include = ["okfgraph*"]

[tool.pytest]
markers = [
    "slow: GPU-heavy or large-batch tests",
    "integration: Tests with real model loading",
]
addopts = ["-v", "--tb=short"]
