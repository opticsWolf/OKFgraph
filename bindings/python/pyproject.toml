[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "okfgraph"
dynamic = ["version"]
description = "Rust-backed OKF knowledge graph with a thin Python facade"
readme = "../../README.md"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.12,<3.15"
license = "Apache-2.0 OR MIT"
dependencies = ["pydantic>=2.0"]

[project.urls]
Homepage = "https://opticswolf.github.io/OKFgraph/"
Documentation = "https://github.com/opticsWolf/OKFgraph/blob/main/docs/rust-compat.md"
Repository = "https://github.com/opticsWolf/OKFgraph"

[project.optional-dependencies]
cpu = ["onnxruntime==1.31.1"]
gpu = ["onnxruntime-gpu[cuda,cudnn]==1.31.1"]
pdf = ["okfgraph-pdf"]
dev = ["pytest>=8"]

[project.scripts]
okf = "okfgraph._entry:okf"
okf-mcp = "okfgraph.mcp_server:main"

[tool.maturin]
python-source = "python"
module-name = "okfgraph._native"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
