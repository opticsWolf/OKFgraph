name: rust-core

on:
  push:
    branches: [rust-core]
  pull_request:
    branches: [rust-core]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Windows vcpkg (check)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          vcpkgJsonGlob: vcpkg.json
          doNotCache: true
      - name: Windows OpenSSL (check)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=${RUNVCPKG_VCPKG_ROOT}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          echo "${VCPKG_INSTALLATION_ROOT}/installed/x64-windows/bin" >> "$GITHUB_PATH"
          vcpkg install --classic openssl:x64-windows
      - name: macOS OpenSSL 3 (check)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (core, no optional engines)
        run: cargo clippy -p okfgraph --no-default-features --all-targets -- -D warnings
      - name: Check workspace
        run: cargo check --workspace --no-default-features
      - name: Parity runner smoke
        run: cargo run -p okfgraph --no-default-features --bin parity-run -- parity/scenarios/minimal.json

  wheel:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - name: Windows vcpkg (wheels)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          vcpkgJsonGlob: vcpkg.json
          doNotCache: true
      - name: Windows OpenSSL (wheels)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=${RUNVCPKG_VCPKG_ROOT}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          echo "${VCPKG_INSTALLATION_ROOT}/installed/x64-windows/bin" >> "$GITHUB_PATH"
          vcpkg install --classic openssl:x64-windows
      - name: macOS OpenSSL 3 (wheels)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          # Ladybug's std::format usage needs the macOS 13.3 libc++ runtime.
          echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"
      - name: Build wheels
        shell: bash
        run: |
          python -m pip install "maturin>=1.14,<2"
          python bindings/python/build_wheel.py --profile dev
          python addons/pdf/build_wheel.py --profile dev
          python parity/tools/check_packaging.py
      - name: Install and smoke
        shell: bash
        run: |
          python -m pip install target/wheels/okfgraph-*.whl target/wheels/okfgraph_pdf-*.whl
          mkdir -p parity/out
          cp parity/fixtures/oracle-v10.db parity/out/ci-facade.db
          python parity/tools/check_wheel.py
          python parity/tools/check_facade.py --db parity/out/ci-facade.db
      - name: Python version matrix
        shell: bash
        run: >
          python parity/tools/check_python_matrix.py
          --main 'okfgraph-*.whl'
          --pdf 'okfgraph_pdf-*.whl'
      - name: UDS unit smokes (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test -p okfgraph --no-default-features --features mcp --lib unix_listener
      - name: UDS client smoke (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build -p okfgraph --no-default-features --features cli,server,mcp --bin okf
          python parity/tools/check_uds.py
      - name: External lane unit tests
        shell: bash
        run: cargo test -p okfgraph --all-features --lib embed::external
