# Publish okfgraph to PyPI from a release tag.
#
# Flow: push a tag named `v<crate version>` (e.g. v0.16.0). The workflow
# builds one wheel per platform — the facade, the native core and the PDF
# plugin are all inside that wheel — and publishes them as a single PyPI
# project (OIDC trusted publishing, no tokens).
#
# The GPU parity matrix is a documented manual release gate; hosted CI is the
# build/smoke gate. See docs/release-gate.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare release tag with workspace versions
        run: |
          python -c "
          import os, tomllib
          tag = os.environ['TAG']
          root = tomllib.load(open('Cargo.toml','rb'))['package']['version']
          py = tomllib.load(open('bindings/python/Cargo.toml','rb'))['package']['version']
          pdf = tomllib.load(open('addons/pdf/Cargo.toml','rb'))['package']['version']
          assert root == py == pdf, (root, py, pdf)
          want = 'v' + root
          assert tag == want, f'release tag {tag} != version {want}'
          print('version ok:', tag)
          "
        env:
          TAG: ${{ github.ref_name }}

  build:
    name: wheel (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - name: Windows vcpkg
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          vcpkgJsonGlob: vcpkg.json
          doNotCache: true
      - name: Windows OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=${RUNVCPKG_VCPKG_ROOT}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          echo "${VCPKG_INSTALLATION_ROOT}/installed/x64-windows/bin" >> "$GITHUB_PATH"
          vcpkg install --classic openssl:x64-windows
      - name: macOS OpenSSL 3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install "maturin>=1.14,<2"
          python bindings/python/build_wheel.py --release
          python parity/tools/check_packaging.py
      - name: Smoke
        shell: bash
        run: |
          python -m pip install target/wheels/okfgraph-*.whl
          mkdir -p parity/out
          cp parity/fixtures/oracle-v10.db parity/out/release-smoke.db
          python parity/tools/check_wheel.py
          python parity/tools/check_facade.py --db parity/out/release-smoke.db
          python parity/tools/check_pdf_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/okfgraph-*.whl
          if-no-files-found: error

  publish-okfgraph:
    name: publish okfgraph to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: attach wheels to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/okfgraph-*.whl
          generate_release_notes: true
