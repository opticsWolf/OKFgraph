[package]
name = "okf-embed"
version = "0.1.0"
edition = "2021"
description = "Jina v5 text embeddings via ONNX Runtime — Rust core with PyO3 bindings (bobine pattern)"
license = "MIT OR Apache-2.0"

[lib]
name = "okf_embed"
crate-type = ["cdylib"]

[dependencies]
# ONNX Runtime (same pin as bobine: dynamic load, CUDA probe + CPU fallback).
# `ndarray` feature aligns tensor types with our direct ndarray dep (0.17).
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "cuda", "ndarray"] }
tokenizers = "0.21"
hf-hub = { version = "1.0", features = ["blocking", "rustls-tls"] }
ndarray = "0.17"
pyo3 = { version = "0.29", features = ["extension-module"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
