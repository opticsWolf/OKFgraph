name: rust-core

on:
  push:
    branches: [rust-core]
  pull_request:
    branches: [rust-core]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (core, no optional engines)
        run: cargo clippy -p okfgraph --no-default-features --all-targets -- -D warnings
      - name: Check workspace
        run: cargo check --workspace --no-default-features
      - name: Parity runner smoke
        run: cargo run -p okfgraph --bin parity-run -- parity/scenarios/minimal.json

  wheel:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - name: Windows OpenSSL (vcpkg)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgArguments: openssl:x64-windows
          vcpkgTriplet: x64-windows
      - name: Export vcpkg environment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"
          echo "${VCPKG_INSTALLATION_ROOT}/installed/x64-windows/bin" >> "$GITHUB_PATH"
      - name: Build wheels
        shell: bash
        run: |
          python -m pip install "maturin>=1.14,<2"
          python bindings/python/build_wheel.py --profile dev
          python addons/pdf/build_wheel.py --profile dev
          python parity/tools/check_packaging.py
      - name: Install and smoke
        shell: bash
        run: |
          python -m pip install --no-deps target/wheels/okfgraph-*.whl target/wheels/okfgraph_pdf-*.whl
          mkdir -p parity/out
          cp parity/fixtures/oracle-v10.db parity/out/ci-facade.db
          python parity/tools/check_wheel.py
          python parity/tools/check_facade.py --db parity/out/ci-facade.db
      - name: Python version matrix
        shell: bash
        run: >
          python parity/tools/check_python_matrix.py
          --main 'okfgraph-*.whl'
          --pdf 'okfgraph_pdf-*.whl'
      - name: UDS unit smokes (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test -p okfgraph --no-default-features --features mcp --lib unix_listener
